<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EMO // THE LOST STUDIO</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030405;color:#fff;font-family:Inter,sans-serif}body{display:flex;align-items:center;justify-content:center}.game{width:min(100vw,177.7778vh);height:min(100vh,56.25vw);position:relative;overflow:hidden;background:#07090b}.world{position:absolute;width:1500px;height:850px;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#07090b}.sky{position:absolute;inset:0;background:radial-gradient(circle at 72% 18%,#302124 0,transparent 28%),linear-gradient(180deg,#090b10 0,#111317 55%,#08090a 100%)}.sky:after{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:110px 110px;opacity:.07}.ground{position:absolute;left:-100px;right:-100px;bottom:-20px;height:430px;background:linear-gradient(175deg,#121517,#070809 72%);clip-path:polygon(0 18%,100% 0,100% 100%,0 100%)}.road{position:absolute;width:1500px;height:90px;left:0;top:480px;background:#0d1012;border-top:1px solid #24282a;border-bottom:1px solid #171a1c;transform:rotate(-2deg)}.building{position:absolute;width:220px;height:125px;padding:16px;border:1px solid #ffffff13;border-radius:12px;background:linear-gradient(145deg,#111416,#080a0b);box-shadow:0 18px 50px #000c;z-index:3}.building i{display:block;color:#ff3038;font-style:normal;font-size:23px;margin-bottom:8px}.building b{display:block;font:700 15px "Space Grotesk"}.building small{display:block;color:#555;font-size:9px;letter-spacing:.14em;margin-top:5px}.studio{left:130px;top:155px}.archive{left:650px;top:105px}.signal{right:120px;top:165px}.insta{left:620px;bottom:90px}.obj{position:absolute;width:76px;height:48px;display:flex;align-items:center;justify-content:center;border:1px solid #ff303866;border-radius:8px;background:#0b0d0e;color:#eee;font:800 8px Inter;letter-spacing:.08em;box-shadow:0 0 30px #ff303811;z-index:5;animation:float 2.4s ease-in-out infinite}.o1{left:430px;top:250px}.o2{left:790px;top:330px}.o3{left:330px;top:500px}.o4{left:1030px;top:430px}.o5{left:1240px;top:275px}.obj.found{opacity:.18;transform:scale(.75);animation:none}.player{position:absolute;left:725px;top:400px;width:58px;height:70px;padding:3px;border-radius:16px 16px 12px 12px;background:#08090b;border:2px solid #ff3038;box-shadow:0 0 25px #ff303844;z-index:8}.player img{width:100%;height:100%;object-fit:cover;border-radius:11px}.hud{position:absolute;inset:0;z-index:20;pointer-events:none}.title{position:absolute;left:24px;top:22px}.title b{font:800 18px "Space Grotesk"}.title span{display:block;color:#666;font-size:9px;letter-spacing:.16em;margin-top:4px}.stats{position:absolute;right:24px;top:22px;color:#888;font-size:10px}.stats b{color:#fff;margin-left:5px}.prompt{position:absolute;left:50%;top:24px;transform:translateX(-50%);padding:12px 18px;border:1px solid #ffffff12;border-radius:12px;background:#050608dd;text-align:center;font:800 13px "Space Grotesk"}.prompt span{display:block;color:#777;font:500 9px Inter;margin-top:5px}.status{position:absolute;left:24px;bottom:22px;color:#777;font-size:11px}.close{position:absolute;right:24px;bottom:18px;pointer-events:auto;border:1px solid #ffffff22;background:#0b0b0fcc;color:#fff;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}@keyframes float{50%{transform:translateY(-8px)}}@media(max-aspect-ratio:16/9){.game{width:100vw;height:100vh}.world{width:1500px;height:850px}.title{left:16px;top:16px}.stats{right:16px;top:16px}.prompt{top:16px;max-width:82%;white-space:normal}.status{left:16px;bottom:16px}.close{right:16px;bottom:14px}}@media(min-aspect-ratio:16/9){.game{width:177.7778vh;height:100vh}}</style></head><body><div class="game" id="game"><div class="world" id="world"><div class="sky"></div><div class="ground"></div><div class="road"></div><div class="building studio"><i>✦</i><b>KXEM0 STUDIO</b><small>THE CREATOR'S ROOM</small></div><div class="building archive"><i>▣</i><b>THUMB ARCHIVE</b><small>HIDDEN WORK</small></div><div class="building signal"><i>⌁</i><b>SIGNAL TOWER</b><small>FIND THE EXIT</small></div><div class="building insta"><i>◎</i><b>THE SIGNAL</b><small>@KXEM0DESIGN</small></div><div class="obj o1">SKETCH</div><div class="obj o2">THUMB</div><div class="obj o3">BADGE</div><div class="obj o4">CAM</div><div class="obj o5">SIGNAL</div><div class="player" id="player"><img src="https://raw.githubusercontent.com/OG-Luffy/graphic-design-portfolio/main/assets/profile.jpg" alt="Emo"></div></div><div class="hud"><div class="title"><b>EMO // THE LOST STUDIO</b><span>EXPLORE • DISCOVER • ESCAPE</span></div><div class="stats">DISCOVERED <b id="score">0/5</b></div><div class="prompt" id="prompt">THE STUDIO IS QUIET...<span>WASD / ARROWS • SWIPE</span></div><div class="status" id="status">Find the five hidden objects.</div><button class="close" onclick="window.close()">CLOSE GAME</button></div></div><script>(function(){const world=document.getElementById('world'),player=document.getElementById('player'),objs=[...document.querySelectorAll('.obj')],score=document.getElementById('score'),status=document.getElementById('status'),prompt=document.getElementById('prompt');let x=725,y=400,found=0,keys={},touch=null;function render(){player.style.left=x+'px';player.style.top=y+'px';world.style.transform='translate(calc(-50% + '+(innerWidth/2-(x+29))+'px),calc(-50% + '+(innerHeight/2-(y+35))+'px))';objs.forEach(o=>{if(o.classList.contains('found'))return;const dx=o.offsetLeft+38-(x+29),dy=o.offsetTop+24-(y+35);if(Math.hypot(dx,dy)<58){o.classList.add('found');found++;score.textContent=found+'/5';status.textContent=found===5?'SIGNAL FOUND — YOU ESCAPED 🔥':'Hidden object discovered ✓';if(found===5)prompt.innerHTML='SIGNAL FOUND — WELCOME TO KXEM0 DESIGN<span>All five secrets discovered.</span>'}});requestAnimationFrame(render)}addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);setInterval(()=>{let dx=0,dy=0;if(keys.a||keys.ArrowLeft)dx-=4;if(keys.d||keys.ArrowRight)dx+=4;if(keys.w||keys.ArrowUp)dy-=4;if(keys.s||keys.ArrowDown)dy+=4;x=Math.max(25,Math.min(1415,x+dx));y=Math.max(25,Math.min(765,y+dy))},16);const s=document.getElementById('game');s.addEventListener('touchstart',e=>{const t=e.touches[0];touch={x:t.clientX,y:t.clientY}},{passive:true});s.addEventListener('touchmove',e=>{if(!touch)return;const t=e.touches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y;if(Math.abs(dx)>7){x=Math.max(25,Math.min(1415,x+(dx>0?8:-8)));touch.x=t.clientX}if(Math.abs(dy)>7){y=Math.max(25,Math.min(765,y+(dy>0?8:-8)));touch.y=t.clientY}},{passive:true});s.addEventListener('touchend',()=>touch=null);render()})();</script></body></html>
