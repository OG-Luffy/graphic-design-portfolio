<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EMO // BLOCKWORLD</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101216;color:#fff;font-family:Arial,sans-serif}body{display:flex;align-items:center;justify-content:center}.game{width:100vw;height:100vh;position:relative;overflow:hidden;background:linear-gradient(#15181d,#08090b)}.top{position:absolute;left:0;right:0;top:0;z-index:20;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#08090bcc,transparent)}.top b{font-size:15px;letter-spacing:.04em}.top span{display:block;color:#777;font-size:9px;letter-spacing:.14em;margin-top:4px}.ui{font-size:11px;color:#aaa}.ui b{color:#fff}.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:900px}.island{position:relative;width:min(86vw,900px);height:min(70vh,620px);transform:rotateX(57deg) rotateZ(-45deg);transform-style:preserve-3d}.tile{position:absolute;width:92px;height:92px;border:2px solid #20252b;background:#252b30;box-shadow:0 14px 0 #12161a,0 22px 35px #0008;transform-style:preserve-3d}.tile:before{content:"";position:absolute;left:0;top:100%;width:100%;height:16px;background:#171b1f;transform-origin:top;transform:rotateX(-90deg)}.tile:after{content:"";position:absolute;left:100%;top:0;width:16px;height:100%;background:#1b2024;transform-origin:left;transform:rotateY(90deg)}.t1{left:30%;top:18%}.t2{left:40%;top:18%}.t3{left:50%;top:18%}.t4{left:30%;top:33%}.t5{left:40%;top:33%;background:#384047}.t6{left:50%;top:33%}.t7{left:30%;top:48%}.t8{left:40%;top:48%}.t9{left:50%;top:48%}.tower{position:absolute;width:92px;height:180px;left:40%;top:3%}.tower .cube{position:absolute;inset:0;background:#4a5157;border:2px solid #252b30;box-shadow:0 18px 0 #15191c}.goal{position:absolute;left:50%;top:0;width:92px;height:92px;transform:translate(-50%,-4px);border-radius:10px;background:#ff3038;border:4px solid #ffd4d4;box-shadow:0 0 35px #ff3038aa;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:25px}.robot{position:absolute;width:54px;height:54px;left:40%;top:49%;z-index:10;transform:rotateZ(45deg) rotateX(-57deg);transition:.15s}.robot:before{content:"";position:absolute;inset:5px;border-radius:12px;background:#e9ecef;border:3px solid #ff3038;box-shadow:0 8px 18px #0008}.robot:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#ff3038;left:22px;top:18px;box-shadow:0 0 12px #ff3038}.controls{position:absolute;z-index:30;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px}.controls button,.exit{border:1px solid #ffffff20;background:#11151a;color:#fff;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.win{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#050608cc;backdrop-filter:blur(6px)}.win.open{display:flex}.win-card{padding:28px;border:1px solid #ffffff18;border-radius:18px;background:#101318;text-align:center}.win-card h2{margin:0 0 8px;font-size:30px}.win-card p{color:#888;font-size:12px}.exit{margin-top:12px;background:#fff;color:#08090b}@media(max-width:600px){.top{padding:14px}.top b{font-size:12px}.island{width:760px;height:560px;transform:rotateX(57deg) rotateZ(-45deg) scale(.78)}.controls{bottom:16px}.controls button{padding:11px 13px;font-size:10px}.win-card{width:88%}}</style></head><body><div class="game" id="game"><div class="top"><div><b>EMO // BLOCKWORLD</b><span>ISOMETRIC PUZZLE • LEVEL 01</span></div><div class="ui">MOVES <b id="moves">0</b> · <b>1/3</b></div></div><div class="stage"><div class="island"><div class="tile t1"></div><div class="tile t2"></div><div class="tile t3"></div><div class="tile t4"></div><div class="tile t5"></div><div class="tile t6"></div><div class="tile t7"></div><div class="tile t8"></div><div class="tile t9"></div><div class="tower"><div class="cube"></div><div class="goal">✦</div></div><div class="robot" id="robot"></div></div></div><div class="controls"><button id="left">◀</button><button id="up">▲</button><button id="down">▼</button><button id="right">▶</button></div><div class="win" id="win"><div class="win-card"><h2>LEVEL COMPLETE 🔥</h2><p>You reached the KXEM0 signal.</p><button class="exit" onclick="location.reload()">PLAY AGAIN</button></div></div></div><script>(function(){const robot=document.getElementById('robot'),movesEl=document.getElementById('moves'),win=document.getElementById('win');let x=1,y=2,moves=0;function render(){robot.style.left=(40+(x-1)*10)+'%';robot.style.top=(49+(y-2)*15)+'%'}function move(dx,dy){const nx=x+dx,ny=y+dy;if(nx<0||nx>2||ny<0||ny>3)return;x=nx;y=ny;moves++;movesEl.textContent=moves;render();if(x===1&&y===0)win.classList.add('open')}[['left',-1,0],['right',1,0],['up',0,-1],['down',0,1]].forEach(a=>document.getElementById(a[0]).onclick=()=>move(a[1],a[2]));addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1,0);if(e.key==='ArrowRight'||e.key==='d')move(1,0);if(e.key==='ArrowUp'||e.key==='w')move(0,-1);if(e.key==='ArrowDown'||e.key==='s')move(0,1)});let touch=null;game.addEventListener('touchstart',e=>{const t=e.touches[0];touch={x:t.clientX,y:t.clientY}},{passive:true});game.addEventListener('touchend',e=>{if(!touch)return;const t=e.changedTouches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>25){if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1)}touch=null},{passive:true});render()})();</script></body></html>
