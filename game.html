<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EMO // BLOCKWORLD</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0c0f;color:#fff;font-family:Inter,Arial,sans-serif}body{display:flex;align-items:center;justify-content:center}.game{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 28%,#303943 0,#151a20 32%,#08090b 78%)}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.top{position:absolute;z-index:5;top:0;left:0;right:0;padding:18px 22px;display:flex;justify-content:space-between;background:linear-gradient(#050608dd,transparent)}.title b{font-size:15px;letter-spacing:.04em}.title span{display:block;color:#666;font-size:9px;letter-spacing:.14em;margin-top:4px}.stats{font-size:10px;color:#777;text-align:right}.stats b{color:#fff}.controls{position:absolute;z-index:8;bottom:20px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:52px 52px;gap:7px}.controls button,.restart{border:1px solid #ffffff20;background:#0c1014eF;color:#fff;border-radius:13px;font-weight:900;font-size:17px;box-shadow:0 10px 30px #0009;backdrop-filter:blur(8px)}.controls button:active,.restart:active{transform:scale(.93)}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.message{position:absolute;z-index:7;left:50%;top:76px;transform:translateX(-50%);padding:9px 14px;border:1px solid #ffffff12;background:#050608cc;border-radius:999px;color:#888;font-size:10px;white-space:nowrap}.win{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#050608bb;backdrop-filter:blur(8px)}.win.open{display:flex}.card{width:min(360px,88%);padding:28px;border:1px solid #ffffff18;border-radius:20px;background:#101419;text-align:center;box-shadow:0 30px 90px #000}.card h2{margin:0 0 8px;font-size:28px}.card p{margin:0;color:#888;font-size:12px;line-height:1.6}.restart{margin-top:18px;padding:12px 18px;font-size:12px;background:#fff;color:#08090b}@media(min-width:800px){.controls{display:none}}@media(max-width:600px){.top{padding:14px}.title b{font-size:12px}.message{top:66px;max-width:80%;white-space:normal;text-align:center}.controls{bottom:15px}.stats{font-size:9px}}</style></head><body><div class="game" id="game"><canvas id="world"></canvas><div class="top"><div class="title"><b>EMO // BLOCKWORLD</b><span>ISOMETRIC PUZZLE • CREATOR LAB</span></div><div class="stats">LEVEL <b id="level">1</b>/3<br>MOVES <b id="moves">0</b></div></div><div class="message" id="message">Reach the red signal • WASD / arrows • swipe</div><div class="controls"><button class="up" data-d="up">▲</button><button class="left" data-d="left">◀</button><button class="down" data-d="down">▼</button><button class="right" data-d="right">▶</button></div><div class="win" id="win"><div class="card"><h2 id="winTitle">LEVEL COMPLETE</h2><p id="winText">The KXEM0 signal is unlocked.</p><button class="restart" id="next">NEXT LEVEL ↗</button></div></div></div><script>(function(){const canvas=document.getElementById('world'),ctx=canvas.getContext('2d'),levelEl=document.getElementById('level'),movesEl=document.getElementById('moves'),msg=document.getElementById('message'),win=document.getElementById('win'),next=document.getElementById('next');let W,H,dpr,level=0,moves=0,player,goal,blocks,pressed=false,touch=null;const levels=[{w:7,h:7,start:[0,5,0],goal:[6,1,0],blocks:[[0,5,0],[1,5,0],[2,5,0],[2,4,0],[2,3,0],[3,3,0],[4,3,0],[4,2,0],[5,2,0],[6,2,0],[6,1,0],[1,5,1],[2,5,1],[4,3,1]]},{w:8,h:7,start:[0,6,0],goal:[7,1,1],blocks:[[0,6,0],[1,6,0],[2,6,0],[2,5,0],[2,4,0],[3,4,0],[4,4,0],[4,3,0],[5,3,0],[6,3,0],[6,2,0],[7,2,0],[7,1,1],[2,5,1],[4,4,1],[6,2,1]]},{w:9,h:8,start:[0,7,0],goal:[8,1,2],blocks:[[0,7,0],[1,7,0],[2,7,0],[2,6,0],[2,5,0],[3,5,0],[4,5,0],[4,4,0],[5,4,0],[6,4,0],[6,3,0],[7,3,0],[8,3,0],[8,2,0],[8,1,2],[3,5,1],[5,4,1],[7,3,1],[8,2,1],[8,1,1]]}];function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(player)draw()}addEventListener('resize',resize);function load(){const L=levels[level];blocks=L.blocks.map(a=>a.slice());player={x:L.start[0],y:L.start[1],z:L.start[2]};goal={x:L.goal[0],y:L.goal[1],z:L.goal[2]};moves=0;levelEl.textContent=level+1;movesEl.textContent=0;win.classList.remove('open');msg.textContent='Reach the red signal • WASD / arrows • swipe';draw()}function iso(x,y,z,s,cx,cy){return[cx+(x-y)*s,cy+(x+y)*s*.5-z*s*.72]}function cube(x,y,z,s,cx,cy,highlight){const p=iso(x,y,z,s,cx,cy),q=iso(x+1,y,z,s,cx,cy),r=iso(x+1,y+1,z,s,cx,cy),t=iso(x,y+1,z,s,cx,cy);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.lineTo(r[0],r[1]);ctx.lineTo(t[0],t[1]);ctx.closePath();ctx.fillStyle=highlight?'#ff343d':'#394148';ctx.fill();ctx.strokeStyle=highlight?'#ff9da1':'#59636c';ctx.stroke();const dz=s*.72;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(t[0],t[1]);ctx.lineTo(t[0],t[1]+dz);ctx.lineTo(p[0],p[1]+dz);ctx.closePath();ctx.fillStyle=highlight?'#a82028':'#20262b';ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(q[0],q[1]);ctx.lineTo(r[0],r[1]);ctx.lineTo(r[0],r[1]+dz);ctx.lineTo(q[0],q[1]+dz);ctx.closePath();ctx.fillStyle=highlight?'#7c1c22':'#2a3137';ctx.fill();ctx.stroke()}function draw(){if(!W)return;ctx.clearRect(0,0,W,H);const L=levels[level],s=Math.min(W/(L.w+L.h)*.82,H/((L.w+L.h)*.55+5)*.82,52);const cx=W/2,cy=H*.46;const sorted=blocks.slice().sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2]));sorted.forEach(a=>cube(a[0],a[1],a[2],s,cx,cy,false));const g=iso(goal.x+.5,goal.y+.5,goal.z+1.15,s,cx,cy);ctx.save();ctx.shadowColor='#ff3038';ctx.shadowBlur=22;ctx.fillStyle='#ff3038';ctx.beginPath();ctx.arc(g[0],g[1],Math.max(8,s*.18),0,Math.PI*2);ctx.fill();ctx.restore();const p=iso(player.x+.5,player.y+.5,player.z+1.2,s,cx,cy);ctx.save();ctx.shadowColor='#ff3038';ctx.shadowBlur=18;ctx.fillStyle='#f2f3f4';ctx.strokeStyle='#ff3038';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(p[0]-s*.25,p[1]-s*.38,s*.5,s*.5,9);ctx.fill();ctx.stroke();ctx.fillStyle='#ff3038';ctx.beginPath();ctx.arc(p[0],p[1]-s*.18,s*.07,0,Math.PI*2);ctx.fill();ctx.restore()}function can(x,y,z){return blocks.some(b=>b[0]===x&&b[1]===y&&b[2]===z)}function move(dx,dy){if(win.classList.contains('open'))return;let nx=player.x+dx,ny=player.y+dy,nz=player.z;if(nx<0||ny<0||nx>=levels[level].w||ny>=levels[level].h)return;if(can(nx,ny,nz)){}else if(can(nx,ny,nz-1))nz--;else return;player={x:nx,y:ny,z:nz};moves++;movesEl.textContent=moves;if(player.x===goal.x&&player.y===goal.y&&player.z===goal.z){win.classList.add('open');document.getElementById('winTitle').textContent=level===2?'STUDIO MASTERED 🔥':'LEVEL '+(level+1)+' COMPLETE';document.getElementById('winText').textContent=level===2?'You found the final KXEM0 signal.':'The path is clear. Keep exploring.';next.textContent=level===2?'PLAY AGAIN ↗':'NEXT LEVEL ↗'}draw()}function input(d){if(d==='left')move(-1,0);if(d==='right')move(1,0);if(d==='up')move(0,-1);if(d==='down')move(0,1)}document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>input(b.dataset.d)));addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')input('left');if(k==='d'||k==='arrowright')input('right');if(k==='w'||k==='arrowup')input('up');if(k==='s'||k==='arrowdown')input('down')});canvas.addEventListener('touchstart',e=>{const t=e.touches[0];touch={x:t.clientX,y:t.clientY}},{passive:true});canvas.addEventListener('touchend',e=>{if(!touch)return;const t=e.changedTouches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>24)input(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));touch=null},{passive:true});next.onclick=()=>{if(level===2)level=0;else level++;load()};resize();load()})();</script></body></html>
